<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Cascade Break</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Startup splash: shown for 2 seconds (CSS fades it out; app.ts removes it
         and fills in the version). Skipped in tests (?test=1). -->
    <div id="splash" class="splash" role="img" aria-label="Cascade Break">
      <img src="splash.png" alt="" class="splash-img" />
      <div class="splash-title">Cascade Break</div>
      <div id="splashVersion" class="splash-version"></div>
    </div>

    <div id="app">
      <header class="gbar">
        <button
          id="menuBtn"
          class="menu-btn"
          aria-label="Menu"
          aria-haspopup="true"
          aria-expanded="false"
        >
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <path
              d="M3 6h18M3 12h18M3 18h18"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              fill="none"
            />
          </svg>
        </button>
        <span class="round-label">Round <span id="roundNum">0</span></span>
        <span
          id="oppStatus"
          class="opp-status"
          title="Opponent has come out"
          hidden
        ></span>
        <span id="scoreP2" class="score" title="Opponent's score">0</span>
        <nav id="menuPop" class="menu-pop" hidden>
          <button id="menuNewBtn">New</button>
          <button id="menuRoundBtn">Round 2</button>
          <button id="menuGoalBtn">Goal 1000</button>
          <button id="menuHelpBtn">Help</button>
          <button id="menuDebugBtn">Debug</button>
          <div id="menuVersion" class="menu-version"></div>
        </nav>
      </header>

      <div id="oppHand" class="opp-hand" aria-label="Opponent's hand"></div>

      <main id="banner" class="banner" hidden></main>

      <section class="deck-row">
        <button id="pileBtn" class="pile" aria-label="Pile: tap to draw">
          <span id="pileCount" class="pile-count">0</span>
        </button>
        <div id="openRow" class="open-row" aria-label="Cascade"></div>
      </section>

      <section id="tableau" class="tableau" aria-label="Table"></section>

      <section id="rearrangeHandPoolWrap" class="rearrange-pool" hidden>
        <h2>
          Your hand, in the draft
          <span class="hint"
            >(tap a card, then tap a group to move it there)</span
          >
        </h2>
        <div id="rearrangeHandPool" class="open-row"></div>
      </section>
      <div id="rearrangeControls" class="controls" hidden>
        <button id="rearrangeNewGroupBtn">Move selected to a new group</button>
        <button id="rearrangeToHandBtn">Move selected to hand</button>
        <button id="commitRearrangeBtn">Commit rearrange</button>
        <button id="cancelRearrangeBtn">Cancel rearrange</button>
      </div>
      <span id="tableauHint" hidden></span>

      <div id="balloon" class="balloon" hidden>
        <span id="balloonText"></span>
        <button id="balloonClose" class="x-btn" aria-label="Dismiss">×</button>
      </div>

      <div class="status-line">
        <span id="turnLabel">—</span>
        <span id="obligationLabel" class="obligation" hidden></span>
        <span id="selectionCount" class="selection-count" hidden></span>
        <span id="targetIndicator" class="selection-count" hidden></span>
      </div>

      <div id="hand" class="hand"></div>

      <footer class="bottom-bar">
        <button
          id="undoDrawBtn"
          class="icon-btn"
          aria-label="Undo pickup"
          title="Undo pickup"
        >
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <path
              d="M12 5a7 7 0 1 1-6.6 9.3 1 1 0 1 1 1.9-.6A5 5 0 1 0 8 8.4L9.6 10H4V4.4l2.5 2.5A7 7 0 0 1 12 5z"
              fill="currentColor"
            />
          </svg>
        </button>
        <div id="actionBar" class="action-bar">
          <!-- Buttons appear only while they apply (see renderControls).
               Drawing from the pile is done by tapping the pile, so
               drawPileBtn stays hidden and is only clicked programmatically. -->
          <button id="drawPileBtn" hidden>Draw from the pile</button>
          <button id="finishDrawingBtn" class="cta">Done drawing</button>
          <button id="layMeldBtn">Lay meld</button>
          <button id="addToMeldBtn">Add to meld</button>
          <button id="swapJokerBtn">Swap joker</button>
          <button id="pullMeldBtn">Pull my cards</button>
          <button id="startRearrangeBtn">Rearrange…</button>
          <button id="discardBtn">Discard</button>
          <button id="clearSelectionBtn" class="secondary">Clear</button>
        </div>
        <span id="scoreP1" class="score" title="Your score">0</span>
      </footer>

      <section id="debugPanel" class="debug-panel" hidden>
        <h2>Debug (menu → Debug to hide)</h2>
        <div class="debug-controls">
          <label
            >Mode:
            <select id="modeSelect">
              <option value="standard">Standard (&gt;1000)</option>
              <option value="quick">Quick (&gt;300)</option>
            </select>
          </label>
          <label
            >Seed:
            <input
              id="seedInput"
              type="text"
              size="8"
              placeholder="random"
              title="Leave blank for a random deal, or enter a previously-shown seed to replay that exact deal (shuffle, starter card, and starter coin-flip)."
          /></label>
          <button id="newGameBtn">New Game</button>
          <span>Seed: <span id="currentSeed">–</span></span>
        </div>
        <h2>AI hand (face up for testing)</h2>
        <div id="aiHand" class="hand"></div>
        <h2>Log</h2>
        <div id="log"></div>
      </section>
    </div>

    <div id="modalRoot" class="modal-root" hidden>
      <div id="modalBox" class="modal-box"></div>
    </div>

    <div id="dialogRoot" class="modal-root dialog-root" hidden>
      <div
        id="dialogBox"
        class="modal-box"
        role="dialog"
        aria-modal="true"
      ></div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
