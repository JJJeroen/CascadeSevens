name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm ci
      - run: npm run build
      - name: Check committed docs/ output is up to date with src/
        run: |
          git diff --exit-code -- docs/*.js
          test -z "$(git status --porcelain -- docs)"
      - run: npm run lint
      - run: npm test
      # tests/smoke_browser.js uses the global WebSocket client, which
      # doesn't exist on Node 18 (stable since Node 22) -- switch just this
      # step up, keeping the rest of the job on the package.json-declared
      # minimum (18) for an actual compatibility check. Uses the
      # google-chrome-stable binary ubuntu-latest ships preinstalled (no
      # extra install step) -- see tests/smoke_browser.js for why this
      # isn't Playwright.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:browser
