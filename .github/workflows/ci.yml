name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm ci
      - run: npm run build
      - name: Check committed docs/ output is up to date with src/
        run: |
          git diff --exit-code -- docs/*.js
          test -z "$(git status --porcelain -- docs)"
      - run: npm run lint
      - run: npm test
