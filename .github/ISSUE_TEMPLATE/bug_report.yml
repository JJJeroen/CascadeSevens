name: Bug report
description: Something behaves incorrectly — engine, AI, or UI
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact sequence — draw, pick up, meld, etc.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs. actual
      description: What should have happened, and what actually happened.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Pick one — after filing, also add the matching `area:*` label if you can.
      options:
        - "engine (docs/engine.js — rules logic)"
        - "ai (docs/ai.js — the heuristic bot)"
        - "ui (docs/app.js, index.html, style.css)"
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "Soft-lock / stalls the game"
        - "Incorrect but recoverable"
        - "Cosmetic"
    validations:
      required: true
